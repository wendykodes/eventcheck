# Render Blueprint for the EventCheck backend (Express + SQLite).
# Apply in Render dashboard: New -> Blueprint -> select this repo.
# NOTE: the persistent disk requires a paid instance type (Starter or higher).
services:
  - type: web
    name: eventcheck-backend
    runtime: node
    plan: starter
    buildCommand: npm ci && rm -rf backend/node_modules/better-sqlite3 node_modules/better-sqlite3 && npm rebuild better-sqlite3 && node backend/smoke-native.js
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: eventcheck-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /data/data.db
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_PIN
        sync: false
      - key: FRONTEND_URL
        sync: false
